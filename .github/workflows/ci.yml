name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check commit subjects
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git log --format=%s "$BASE_SHA..$HEAD_SHA" | while IFS= read -r subject; do
            node scripts/check-commit-message.mjs --message "$subject"
          done
      - run: npm run typecheck
      - run: npm test
      - name: Check Zapstore release guards
        run: node --test scripts/prepare-zapstore.test.mjs scripts/publish-zapstore-proof.test.mjs
      - name: Check Breez release credential validation
        run: node --test scripts/check-breez-api-key.test.mjs
      - name: Install the publishing CLI for integration checks
        uses: ./.github/actions/setup-zsp
      - name: Test Android certificate proof signing with the pinned CLI
        env:
          ZSP_BIN: ${{ runner.temp }}/zsp
        run: node --test scripts/sign-zapstore-proof.test.mjs

  # Release pull requests build the exact APK the release will ship, signed
  # with the upload key, so a broken build is caught before the tag exists.
  android:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release-please--') }}
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
