name: Zapstore

on:
  workflow_call:
    inputs:
      tag:
        description: Published release whose signed APK should be distributed
        required: true
        type: string
    secrets:
      ZAPSTORE_SIGN_WITH:
        required: true
      CLINK_KEYSTORE_BASE64:
        required: true
      CLINK_STORE_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zapstore-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require publisher identity
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
        run: |
          if [ -z "$SIGN_WITH" ]; then
            echo "::error::Add ZAPSTORE_SIGN_WITH (dedicated publisher nsec/hex key or unattended NIP-46 bunker URL). See docs/zapstore.md."
            exit 1
          fi

      - name: Prepare the exact published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          node scripts/prepare-zapstore.mjs "$TAG" "$RUNNER_TEMP/release.json" .zapstore-release.yaml
          git fetch origin "refs/tags/$TAG"
          echo "RELEASE_COMMIT=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_ENV"
          gh release download "$TAG" --pattern "clink-$TAG.apk" --pattern "clink-$TAG.apk.sha256" --dir "$RUNNER_TEMP/zapstore-apk"
          cd "$RUNNER_TEMP/zapstore-apk"
          sha256sum --check "clink-$TAG.apk.sha256"

      - name: Install pinned Zapstore CLI
        run: |
          curl --fail --location --retry 3 https://github.com/zapstore/zsp/releases/download/v0.4.17/zsp-0.4.17-linux-amd64 --output "$RUNNER_TEMP/zsp"
          echo "3f241da6a5dc7a85fe851d3b42b77790b651bd36c7029382a701262bda832d20  $RUNNER_TEMP/zsp" | sha256sum --check
          chmod +x "$RUNNER_TEMP/zsp"

      - name: Verify production APK metadata and signature
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 -c 'import sys, zipfile; sys.stdout.buffer.write(zipfile.ZipFile(sys.argv[1]).read("assets/app.config"))' "$RUNNER_TEMP/zapstore-apk/clink-$TAG.apk" > "$RUNNER_TEMP/apk-config.json"
          node scripts/check-breez-api-key.mjs "$RUNNER_TEMP/apk-config.json"
          "$RUNNER_TEMP/zsp" utils extract-apk "$RUNNER_TEMP/zapstore-apk/clink-$TAG.apk" > "$RUNNER_TEMP/apk.json"
          node scripts/prepare-zapstore.mjs --verify-apk "$TAG" "$RUNNER_TEMP/apk.json"

      - name: Verify the APK belongs to Clink
        env:
          KEYSTORE: ${{ secrets.CLINK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CLINK_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/zapstore.keystore"
          expected=$(keytool -exportcert -keystore "$RUNNER_TEMP/zapstore.keystore" -storepass:env KEYSTORE_PASSWORD -alias clink | sha256sum | cut -d' ' -f1)
          actual=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).cert_fingerprint' "$RUNNER_TEMP/apk.json")
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK does not match Clink's production signing certificate"
            exit 1
          fi

      # Use GitHub as the source, with exact anchored release/asset filters.
      # This preserves the original download URL, date and release notes.
      - name: Publish signed release to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$RUNNER_TEMP/zsp" publish .zapstore-release.yaml
          --quiet --skip-preview --app-created-at-release
          --commit "$RELEASE_COMMIT"

      - name: Link the Android signing certificate to the publisher
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_SIGN_WITH }}
          KEYSTORE_PASSWORD: ${{ secrets.CLINK_STORE_PASSWORD }}
        run: |
          "$RUNNER_TEMP/zsp" identity --link-key "$RUNNER_TEMP/zapstore.keystore" --key-alias clink --offline > "$RUNNER_TEMP/publisher-proof.json"
          node scripts/publish-zapstore-proof.mjs "$RUNNER_TEMP/publisher-proof.json"

      - name: Remove the signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/zapstore.keystore"
