description: |
  Money that just works. Pick a username to send and receive payments.
  Add money or cash out to mobile money, bank or cash through agents near you.
  Keep your balance in dollars or bitcoin, and send or receive bitcoin,
  Lightning, USDT and USDC. Your keys stay on your phone.

  Clink is experimental software that moves real money. Start with small
  amounts and back up your recovery phrase.
